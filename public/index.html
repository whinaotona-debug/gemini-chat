<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gemini</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%234288F6'/%3E%3Cstop offset='.45' stop-color='%239B72F2'/%3E%3Cstop offset='.75' stop-color='%23D96570'/%3E%3Cstop offset='1' stop-color='%23F2BD4D'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M32 4c2 12 12 22 24 24-12 2-22 12-24 24-2-12-12-22-24-24C20 26 30 16 32 4z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <button class="icon-btn" id="close-sidebar" title="閉じる" aria-label="履歴を閉じる">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <button class="new-chat" id="new-chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          新しいチャット
        </button>
      </div>
      <div class="history-label">履歴</div>
      <div class="history-list" id="history-list"></div>
      <form class="key-box" id="key-form">
        <label for="api-key">API キー</label>
        <input id="api-key" type="password" autocomplete="off" placeholder="新しいキーを貼る" />
        <button type="submit">保存して接続</button>
        <p class="key-status" id="key-status"></p>
      </form>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="open-sidebar" title="履歴" aria-label="履歴を開く">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        </button>
        <div class="brand">
          <span class="sparkle" aria-hidden="true"></span>
          <span>Gemini</span>
        </div>
        <div class="top-actions">
          <button class="chip-btn" id="toggle-speak" aria-pressed="false" title="読み上げ">読み上げ</button>
          <button class="icon-btn" id="toggle-theme" title="テーマ" aria-label="テーマ切替">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.2 6.2l1.4 1.4M16.4 16.4l1.4 1.4M17.8 6.2l-1.4 1.4M7.6 16.4l-1.4 1.4"/></svg>
          </button>
        </div>
      </header>

      <section class="thread" id="thread"></section>

      <footer class="composer-wrap">
        <div class="mode-row" id="mode-row">
          <button class="mode-btn active" data-mode="chat" id="mode-chat">トーク</button>
          <button class="mode-btn" data-mode="image" id="mode-image">画像生成</button>
          <select id="aspect" class="aspect" hidden>
            <option value="1:1">1:1</option>
            <option value="16:9">16:9</option>
            <option value="9:16">9:16</option>
            <option value="4:3">4:3</option>
            <option value="3:4">3:4</option>
          </select>
        </div>
        <form class="composer" id="composer">
          <button type="button" class="icon-btn attach" id="attach" title="画像を添付" aria-label="画像を添付">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.5V17a4 4 0 0 1-4 4H8l-5-5V7a4 4 0 0 1 4-4h5.5"/><circle cx="17.5" cy="6.5" r="3.5"/></svg>
          </button>
          <input type="file" id="file" accept="image/*" hidden />
          <div class="input-col">
            <div class="previews" id="previews"></div>
            <textarea id="input" rows="1" placeholder="Gemini にメッセージ"></textarea>
          </div>
          <button type="button" class="icon-btn mic" id="mic" title="音声入力" aria-label="音声入力">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
          <button type="submit" class="send" id="send" title="送信" aria-label="送信">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.6 21 12 3.4 3.4 3 10.3 15 12 3 13.7z"/></svg>
          </button>
        </form>
        <p class="disclaimer">Gemini は間違えることがあります。重要なことは確認してください。</p>
      </footer>
    </main>
  </div>
  <div class="sidebar-backdrop" id="backdrop"></div>
  <script src="/app.js"></script>
</body>
</html>
